<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020812"/><stop offset=".48" stop-color="#071525"/><stop offset="1" stop-color="#03050d"/></linearGradient>
 <linearGradient id="edge" x2="1" y2="1"><stop stop-color="#23e6a0"/><stop offset=".48" stop-color="#55dfff"/><stop offset="1" stop-color="#ff4b5a"/></linearGradient>
 <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#102b3c" stop-opacity=".88"/><stop offset=".55" stop-color="#07101e" stop-opacity=".92"/><stop offset="1" stop-color="#101327" stop-opacity=".88"/></linearGradient>
 <radialGradient id="glowG"><stop stop-color="#00e89a" stop-opacity=".24"/><stop offset="1" stop-color="#00e89a" stop-opacity="0"/></radialGradient>
 <radialGradient id="glowR"><stop stop-color="#ff304f" stop-opacity=".2"/><stop offset="1" stop-color="#ff304f" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#6bb9d0" stroke-opacity=".12" stroke-width="1"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<rect width="1536" height="1024" fill="url(#bg)"/>
<circle cx="180" cy="540" r="410" fill="url(#glowG)"/><circle cx="1370" cy="440" r="440" fill="url(#glowR)"/>
