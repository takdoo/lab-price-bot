name: LAB Whale Watcher

on:
  workflow_run:
    workflows: ["LAB Premium Price Bot"]
    types: [completed]
    branches: [main]
  push:
    paths:
      - 'wallet_watcher.py'
      - 'tests/test_wallet_watcher.py'
      - '.github/workflows/lab-whale-watch.yml'
      - 'requirements.txt'
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: lab-wallet-watcher
  cancel-in-progress: false

jobs:
  watch-top-holders:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout price-bot code (watcher is isolated)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Load persistent wallet snapshot
        run: |
          git fetch origin refs/heads/lab-wallet-state:refs/remotes/origin/lab-wallet-state
          git show origin/lab-wallet-state:top_holders.json > top_holders.json

      - name: Verify Persian font support
        run: |
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          fc-match "DejaVu Sans"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate watcher configuration
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: "@labcoinss"
        run: |
          test -n "$BOT_TOKEN" || { echo "::error::BOT_TOKEN is missing"; exit 1; }
          test -n "$CHAT_ID" || { echo "::error::CHAT_ID is empty"; exit 1; }

      - name: Validate watcher and run unit tests
        run: |
          python -m compileall -q wallet_watcher.py tests
          python -m unittest discover -s tests -p 'test_wallet_watcher.py' -v

      - name: Run wallet watcher
        if: github.ref == 'refs/heads/main'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: "@labcoinss"
          CMC_PLATFORM: "bsc"
          CMC_PRO_API_KEY: ${{ secrets.CMC_PRO_API_KEY }}
          WHALE_ALERT_LAB: "1000000"
        run: python wallet_watcher.py

      - name: Save snapshot to isolated state branch
        if: github.ref == 'refs/heads/main'
        run: |
          git worktree add /tmp/lab-wallet-state origin/lab-wallet-state
          cp top_holders.json /tmp/lab-wallet-state/top_holders.json
          git -C /tmp/lab-wallet-state config user.name "github-actions[bot]"
          git -C /tmp/lab-wallet-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/lab-wallet-state add top_holders.json
          if ! git -C /tmp/lab-wallet-state diff --cached --quiet; then
            git -C /tmp/lab-wallet-state commit -m "Update LAB top-holder snapshot"
            git -C /tmp/lab-wallet-state push origin HEAD:lab-wallet-state
          else
            echo "Snapshot unchanged; no state commit needed."
          fi
