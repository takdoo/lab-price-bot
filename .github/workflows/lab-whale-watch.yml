name: LAB Whale Watcher

on:
  workflow_dispatch:
  repository_dispatch:
    types: [lab-price-update]

permissions:
  contents: write

concurrency:
  group: lab-wallet-watcher
  cancel-in-progress: false

jobs:
  watch-top-holders:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout price-bot code (watcher is isolated)
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Load persistent wallet snapshot
        run: |
          git fetch origin lab-wallet-state
          git show origin/lab-wallet-state:top_holders.json > top_holders.json

      - name: Install Persian font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          fc-cache -f

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate watcher configuration
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID || '@lab_chats' }}
        run: |
          test -n "$BOT_TOKEN" || { echo "::error::BOT_TOKEN is missing"; exit 1; }
          test -n "$CHAT_ID" || { echo "::error::CHAT_ID is empty"; exit 1; }

      - name: Run wallet watcher
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID || '@lab_chats' }}
          CMC_PLATFORM: "BNB Smart Chain"
          WHALE_ALERT_LAB: "1000000"
        run: python wallet_watcher.py

      - name: Save snapshot to isolated state branch
        run: |
          git worktree add /tmp/lab-wallet-state origin/lab-wallet-state
          cp top_holders.json /tmp/lab-wallet-state/top_holders.json
          git -C /tmp/lab-wallet-state config user.name "github-actions[bot]"
          git -C /tmp/lab-wallet-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/lab-wallet-state add top_holders.json
          if ! git -C /tmp/lab-wallet-state diff --cached --quiet; then
            git -C /tmp/lab-wallet-state commit -m "Update LAB top-holder snapshot"
            git -C /tmp/lab-wallet-state push origin HEAD:lab-wallet-state
          else
            echo "Snapshot unchanged; no state commit needed."
          fi
