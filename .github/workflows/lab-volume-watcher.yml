name: LAB Volume Watcher

on:
  workflow_run:
    workflows: ["LAB Premium Price Bot"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "volume_watcher.py"
      - "tests/test_volume_watcher.py"
      - ".github/workflows/lab-volume-watcher.yml"

permissions:
  contents: write

concurrency:
  group: lab-volume-watcher
  cancel-in-progress: false

jobs:
  publish-volume-report:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Load persistent Telegram message state
        run: |
          git fetch origin refs/heads/lab-volume-state:refs/remotes/origin/lab-volume-state
          mkdir -p .volume-state
          git show origin/lab-volume-state:message_id.txt > .volume-state/message_id.txt

      - name: Validate configuration
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: "@labcoinss"
        run: |
          test -n "$BOT_TOKEN" || { echo "::error::BOT_TOKEN is missing"; exit 1; }
          test -n "$CHAT_ID" || { echo "::error::CHAT_ID is empty"; exit 1; }

      - name: Validate and test volume watcher
        run: |
          python -m pip install requests
          python -m compileall -q volume_watcher.py tests/test_volume_watcher.py
          python -m unittest discover -s tests -p 'test_volume_watcher.py' -v

      - name: Publish five-minute spot and futures report
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: "@labcoinss"
          INITIAL_MESSAGE_ID: "3475"
          VOLUME_STATE_FILE: ".volume-state/message_id.txt"
        run: python volume_watcher.py

      - name: Save persistent Telegram message state
        if: success()
        run: |
          git worktree add /tmp/lab-volume-state origin/lab-volume-state
          cp .volume-state/message_id.txt /tmp/lab-volume-state/message_id.txt
          git -C /tmp/lab-volume-state config user.name "github-actions[bot]"
          git -C /tmp/lab-volume-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/lab-volume-state add message_id.txt
          if ! git -C /tmp/lab-volume-state diff --cached --quiet; then
            git -C /tmp/lab-volume-state commit -m "Update LAB volume report message ID"
            git -C /tmp/lab-volume-state push origin HEAD:lab-volume-state
          else
            echo "Volume message state unchanged."
          fi
