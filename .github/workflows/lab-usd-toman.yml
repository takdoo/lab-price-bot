name: LAB USD Toman Watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "usd_toman_watcher.py"
      - "tests/test_usd_toman_watcher.py"
      - ".github/workflows/lab-usd-toman.yml"

permissions:
  contents: write

concurrency:
  group: lab-usd-toman-watcher
  cancel-in-progress: false

jobs:
  publish-usd-rate:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: python -m pip install --disable-pip-version-check requests 'jdatetime>=5,<6'

      - name: Validate configuration
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: "@labcoinss"
        run: |
          test -n "$BOT_TOKEN" || { echo "::error::BOT_TOKEN is missing"; exit 1; }
          test -n "$CHAT_ID" || { echo "::error::CHAT_ID is empty"; exit 1; }

      - name: Validate and test USD watcher
        run: |
          python -m compileall -q usd_toman_watcher.py tests/test_usd_toman_watcher.py
          python -m unittest discover -s tests -p 'test_usd_toman_watcher.py' -v

      - name: Load USD message state
        run: |
          mkdir -p .usd-state
          if git fetch origin refs/heads/lab-usd-rate-state:refs/remotes/origin/lab-usd-rate-state 2>/dev/null; then
            git show origin/lab-usd-rate-state:message_id.txt > .usd-state/message_id.txt
          else
            echo "No prior USD message state; first publication."
          fi

      - name: Publish dollar price in toman
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: "@labcoinss"
          USD_STATE_FILE: ".usd-state/message_id.txt"
        run: python usd_toman_watcher.py

      - name: Save USD message state
        if: success()
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/lab-usd-rate-state; then
            git worktree add /tmp/lab-usd-rate-state origin/lab-usd-rate-state
          else
            git worktree add --detach /tmp/lab-usd-rate-state
            git -C /tmp/lab-usd-rate-state checkout --orphan lab-usd-rate-state
            git -C /tmp/lab-usd-rate-state rm -rf . >/dev/null 2>&1 || true
          fi
          cp .usd-state/message_id.txt /tmp/lab-usd-rate-state/message_id.txt
          git -C /tmp/lab-usd-rate-state config user.name "github-actions[bot]"
          git -C /tmp/lab-usd-rate-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/lab-usd-rate-state add message_id.txt
          if ! git -C /tmp/lab-usd-rate-state diff --cached --quiet; then
            git -C /tmp/lab-usd-rate-state commit -m "Update USD toman message ID"
            git -C /tmp/lab-usd-rate-state push origin HEAD:lab-usd-rate-state
          fi
