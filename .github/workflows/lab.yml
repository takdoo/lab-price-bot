name: LAB Premium Price Bot

on:
  schedule:
    # Offset runs away from common 5-minute boundaries to reduce queue contention.
    # Runs at minutes 2, 7, 12, ... 57 UTC (every 5 minutes).
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [lab-price-update]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lab-price-bot-update
  cancel-in-progress: false

jobs:
  update-price:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Log trigger and schedule
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "Cron: ${{ github.event.schedule || 'manual/push' }}"
          echo "UTC now: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate required secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MESSAGE_ID: ${{ secrets.MESSAGE_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID || '@lab_chats' }}
        run: |
          test -n "$BOT_TOKEN" || { echo "::error::BOT_TOKEN is missing"; exit 1; }
          test -n "$MESSAGE_ID" || { echo "::error::MESSAGE_ID is missing"; exit 1; }
          case "$MESSAGE_ID" in *[!0-9]*) echo "::error::MESSAGE_ID must be numeric"; exit 1;; esac
          test -n "$CHAT_ID" || { echo "::error::CHAT_ID is empty"; exit 1; }

      - name: Validate Python syntax
        run: python -m compileall -q bot.py tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Update LAB price and Telegram message
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID || '@lab_chats' }}
          MESSAGE_ID: ${{ secrets.MESSAGE_ID }}
        run: |
          for attempt in 1 2 3; do
            echo "Price update attempt $attempt/3"
            if python bot.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          echo "::error::LAB price update failed after 3 attempts"
          exit 1
