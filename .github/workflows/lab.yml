name: LAB Premium Price Bot

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [lab-price-update]
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: lab-price-bot-update
  cancel-in-progress: false

jobs:
  update-price:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Log trigger and schedule
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "Cron: ${{ github.event.schedule || 'manual/push' }}"
          echo "UTC now: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate required secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID || '@lab_chats' }}
        run: |
          test -n "$BOT_TOKEN" || { echo "::error::BOT_TOKEN is missing"; exit 1; }
          test -n "$CHAT_ID" || { echo "::error::CHAT_ID is empty"; exit 1; }

      - name: Validate Python syntax
        run: python -m compileall -q bot.py wallet_watcher.py tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Load persistent JARVIS state
        run: |
          git fetch origin refs/heads/lab-jarvis-state:refs/remotes/origin/lab-jarvis-state
          git show origin/lab-jarvis-state:jarvis_state.json > jarvis_state.json

      - name: Load persistent wallet snapshot
        run: |
          git fetch origin refs/heads/lab-wallet-state:refs/remotes/origin/lab-wallet-state
          git show origin/lab-wallet-state:top_holders.json > top_holders.json

      - name: Send new LAB price message
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID || '@lab_chats' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JARVIS_ADMIN_ID: "5477408842"
          JARVIS_LISTEN_SECONDS: "0"
          JARVIS_STATE_FILE: "jarvis_state.json"
        run: |
          for attempt in 1 2 3; do
            echo "Price update attempt $attempt/3"
            if python bot.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          echo "::error::LAB price update failed after 3 attempts"
          exit 1

      - name: Save persistent JARVIS state
        if: always()
        run: |
          git worktree add /tmp/lab-jarvis-state origin/lab-jarvis-state
          cp jarvis_state.json /tmp/lab-jarvis-state/jarvis_state.json
          git -C /tmp/lab-jarvis-state config user.name "github-actions[bot]"
          git -C /tmp/lab-jarvis-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/lab-jarvis-state add jarvis_state.json
          if ! git -C /tmp/lab-jarvis-state diff --cached --quiet; then
            git -C /tmp/lab-jarvis-state commit -m "Update persistent JARVIS state"
            git -C /tmp/lab-jarvis-state push origin HEAD:lab-jarvis-state
          else
            echo "JARVIS state unchanged."
          fi

      - name: Send top-ten LAB wallet balance report
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID || '@lab_chats' }}
          CMC_PRO_API_KEY: ${{ secrets.CMC_PRO_API_KEY }}
          WHALE_ALERT_LAB: "1000000"
        run: python wallet_watcher.py

      - name: Save persistent wallet snapshot
        if: always() && hashFiles('top_holders.json') != ''
        run: |
          git worktree add /tmp/lab-wallet-state origin/lab-wallet-state
          cp top_holders.json /tmp/lab-wallet-state/top_holders.json
          git -C /tmp/lab-wallet-state config user.name "github-actions[bot]"
          git -C /tmp/lab-wallet-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/lab-wallet-state add top_holders.json
          if ! git -C /tmp/lab-wallet-state diff --cached --quiet; then
            git -C /tmp/lab-wallet-state commit -m "Update top-ten LAB wallet snapshot"
            git -C /tmp/lab-wallet-state push origin HEAD:lab-wallet-state
          else
            echo "Wallet snapshot unchanged."
          fi

