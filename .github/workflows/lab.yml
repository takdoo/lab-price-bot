name: LAB Premium Price Bot V2

on:
  push:
    branches:
      - main

  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

  workflow_dispatch:
permissions:
  contents: read

jobs:
  update-price:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Update LAB Price
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID || '@lab_chats' }}
          MESSAGE_ID: ${{ secrets.MESSAGE_ID }}
        run: python bot.py
