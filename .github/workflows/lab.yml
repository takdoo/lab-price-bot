name: LAB Premium Price Bot

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-price-bot-update
  cancel-in-progress: false

jobs:
  update-price:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install requirements
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q bot.py tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Update LAB Price
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID || '@lab_chats' }}
          MESSAGE_ID: ${{ secrets.MESSAGE_ID }}
        run: python bot.py
