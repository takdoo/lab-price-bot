name: LAB Daily Market Intelligence

on:
  schedule:
    # 08:30 UTC = 12:00 Tehran
    - cron: "30 8 * * *"
  workflow_dispatch:
  push:
    paths:
      - "market_insights.py"
      - "tests/test_market_insights.py"
      - ".github/workflows/lab-market-daily.yml"

permissions:
  contents: read

concurrency:
  group: lab-daily-market-report
  cancel-in-progress: false

jobs:
  market-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Run market analysis and tests
        run: |
          python -m compileall -q market_insights.py tests
          python -m unittest discover -s tests -p 'test_market_insights.py' -v
          python market_insights.py
      - name: Send daily report
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID || '@lab_chats' }}
          SEND_TELEGRAM_REPORT: "true"
        run: python market_insights.py
